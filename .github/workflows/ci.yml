name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: '0.12.5'

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make go-build

      - name: Vet
        run: make go-vet

      - name: gofmt
        run: make go-fmt

      - name: staticcheck
        run: make go-staticcheck

      # The axis vet and staticcheck do not cover. Thresholds are loose while
      # the engine is young; see .golangci.yml.
      - name: Complexity lens
        run: make go-lint-complexity

      - name: Test
        run: make go-test

  browser:
    name: Browser calculator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # The WebAssembly build is a compiled artifact nothing else touches, and a
      # page that loads but answers wrongly looks exactly like one that works.
      # The test runs the module under node with the same glue the page uses and
      # compares its answer against the engine's own. Node is on the runner
      # already; the test skips without it, which is why it has a job of its own
      # rather than hiding among the Go tests.
      - name: Build for the browser
        run: make web

      # Browser: the module's answers against the engine's own. Viewer: the
      # camera the page draws with, which needs no parts library — a matrix
      # that throws the model behind the eye shows a blank canvas and no error,
      # so there is nothing in the browser to catch it.
      - name: Answers match the engine
        run: go test ./internal/calc/ -run 'Browser|Viewer' -v

  lua:
    name: Emitted Lua
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      # What is left runs the emitted LDCad script under a Lua runtime. See
      # tests/README.md for why that is the one thing still written in Python.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run --frozen pytest -rs

  libraries:
    name: Against the real libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # The parts library is fetched whole and extracted, which is 144 MB down
      # and about 600 MB on disk. Worth caching rather than doing every run.
      # Bump the version prefix to discard the cache deliberately.
      - name: Cache the parts libraries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/brickmesh-ldraw
            ~/.cache/brickmesh-shadow
          key: >-
            libraries-v2-${{ hashFiles(
              'internal/ldraw/ldraw.go',
              'internal/ldraw/library.go',
              'internal/shadow/shadow.go') }}
          restore-keys: libraries-v2-

      # Everything that needs real gear teeth: the meshing sweep, the tooth
      # phase, the clutch measurements, the clearance checks over whole models.
      - name: Test against the real libraries
        env:
          BRICKMESH_LIBRARIES: '1'
        run: go test ./...

      - name: Report cache footprint
        if: always()
        run: du -sh ~/.cache/brickmesh-* 2>/dev/null || true
