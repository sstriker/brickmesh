name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: '0.12.5'

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make go-build

      - name: Vet
        run: make go-vet

      - name: gofmt
        run: make go-fmt

      - name: staticcheck
        run: make go-staticcheck

      # The axis vet and staticcheck do not cover. Thresholds are loose while
      # the engine is young; see .golangci.yml.
      - name: Complexity lens
        run: make go-lint-complexity

      - name: Test
        run: make go-test

  python:
    name: Python extractor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      # The tests cover the pure-logic modules, which need numpy and nothing
      # heavier. The mesh dependencies (trimesh, python-fcl, scipy) are the
      # `geometry` extra and are exercised by the import smoke test below,
      # rather than being dragged into every matrix entry.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run --frozen pytest -rs

  geometry:
    name: Geometry extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install with the geometry extra
        run: uv sync --frozen --extra geometry

      # Importing every module is a real check: the mesh modules pull trimesh
      # and python-fcl at import time, so a broken wheel or a renamed symbol
      # shows up here instead of the first time someone runs the extractor.
      - name: Import every module
        run: |
          uv run --frozen --extra geometry python - <<'PY'
          import importlib, pkgutil
          import brickmesh_extract as pkg

          failed = []
          for mod in pkgutil.iter_modules(pkg.__path__):
              name = f"{pkg.__name__}.{mod.name}"
              try:
                  importlib.import_module(name)
                  print(f"ok   {name}")
              except Exception as exc:
                  failed.append(f"{name}: {exc!r}")
                  print(f"FAIL {name}: {exc!r}")
          if failed:
              raise SystemExit(f"{len(failed)} module(s) failed to import")
          PY

      # The hole probe needs a collision library, so those tests skip in the
      # matrix job above. This is where they actually run.
      - name: Test, including the mesh-level tests
        run: uv run --frozen --extra geometry pytest -rs

  libraries:
    name: Real LDraw and LDCad libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      # The parity test runs the Go extractor against the Python one over the
      # whole library, so this job needs both toolchains.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      # The shadow library is ~17 MB extracted and the LDraw parts are fetched
      # one file at a time from a third-party mirror, so a cold run is the only
      # one that should ever hit the network.
      #
      # The key is content-addressed rather than run-scoped: what gets fetched
      # is fully determined by the fetch code and by which parts the tests ask
      # for, so an exact hit means the cache already holds everything needed and
      # there is nothing to re-upload. restore-keys still gives a warm start
      # when one of those does change, and the run afterwards saves the
      # superset. Bump the version prefix to discard the cache deliberately.
      - name: Cache the parts libraries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/brickmesh-ldraw
            ~/.cache/brickmesh-shadow
          key: >-
            libraries-v1-${{ hashFiles(
              'extract/brickmesh_extract/ldraw.py',
              'extract/brickmesh_extract/snap.py',
              'internal/ldraw/ldraw.go',
              'internal/shadow/shadow.go',
              'tests/test_real_libraries.py') }}
          restore-keys: libraries-v1-

      - name: Install with the geometry extra
        run: uv sync --frozen --extra geometry

      - name: Test against the real libraries
        env:
          BRICKMESH_LIBRARIES: '1'
        run: uv run --frozen --extra geometry pytest -rs -m libraries

      - name: Report cache footprint
        if: always()
        run: du -sh ~/.cache/brickmesh-* 2>/dev/null || true
