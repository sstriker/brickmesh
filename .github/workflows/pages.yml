# Publishes the functional calculator to GitHub Pages.
#
# Built here rather than committed to a branch: the WebAssembly module is a
# compiled artifact, and wasm_exec.js has to match the compiler that produced
# it. Keeping either in git means keeping them in step by hand.
#
# The site is the calculator only — the functional layer, which needs no parts
# library. It therefore ships no data derived from LDraw or LDCad and carries
# none of their terms. If catalog.bin and meshes.bin are ever published here,
# that changes: see ATTRIBUTION.md.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

# Read-only by default. Only the deploy job gets the two permissions that
# actually publish, and only for as long as it runs.
permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # The two files a browser build reads: the port index it fetches whole,
      # and the triangles it fetches by range. Tier 1 only — the common parts —
      # which is 15 KB and 4.7 MB against tier 2's 31 MB.
      #
      # Both are derived from the LDraw and LDCad libraries and carry their
      # terms. The generator writes a LICENSE.txt beside them saying which
      # applies to which, and it is published with them.
      - name: Cache the parts libraries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/brickmesh-ldraw
            ~/.cache/brickmesh-shadow
          key: >-
            libraries-v2-${{ hashFiles(
              'internal/ldraw/ldraw.go',
              'internal/ldraw/library.go',
              'internal/shadow/shadow.go') }}
          restore-keys: libraries-v2-

      - name: Generate the catalogue and the meshes
        run: go run ./cmd/brickmesh-assets --out site/data --tier 1

      # What a visitor downloads before anything happens. It is the one cost
      # they cannot opt out of, so it is checked rather than watched: the
      # numbers below are roughly twice what these files are today, which is
      # room for real growth and not room for an accident.
      #
      # If this fires, decide rather than raise it. The parts that have to ship
      # are the ones the engine can place (pipeline.Placeable) plus tier 1;
      # anything beyond that belongs in a range request, which is what
      # meshes.bin is laid out for. See docs/architecture.md.
      - name: The download stays small enough to be worth waiting for
        run: |
          set -eu
          limit_bin=12000000   # meshes.bin, bytes
          limit_cat=100000     # catalog.bin, bytes
          bin=$(stat -c%s site/data/meshes.bin)
          cat=$(stat -c%s site/data/catalog.bin)
          echo "meshes.bin  $bin bytes (limit $limit_bin)"
          echo "catalog.bin $cat bytes (limit $limit_cat)"
          gz=$(gzip -c site/data/meshes.bin | wc -c)
          echo "meshes.bin  $gz bytes gzipped, which is what is served"
          fail=0
          [ "$bin" -le "$limit_bin" ] || { echo "meshes.bin is too big"; fail=1; }
          [ "$cat" -le "$limit_cat" ] || { echo "catalog.bin is too big"; fail=1; }
          exit $fail

      - name: Build the WebAssembly module
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" \
            -o web/brickmesh.wasm ./cmd/brickmesh-wasm

      # The module and the glue are a pair: wasm_exec.js is the Go runtime's
      # side of the boundary and has to come from the same toolchain.
      - name: Take the matching wasm_exec.js
        run: |
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js 2>/dev/null \
            || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web/wasm_exec.js

      # The examples are copied rather than linked. In the repository web/examples
      # is a symlink so the page always shows what the tests use; an artifact
      # cannot carry that.
      - name: Assemble
        run: |
          mkdir -p site/examples
          cp web/index.html web/style.css web/app.js web/view.js web/worker.js \
             web/wasm_exec.js web/brickmesh.wasm site/
          cp examples/*.json site/examples/

          # The skill, for reading and for installing by hand. The zip is laid
          # out so it unpacks straight into ~/.claude/skills/.
          mkdir -p site/skill
          cp .claude/skills/brickmesh/SKILL.md site/skill/SKILL.md
          ( cd .claude/skills && zip -qr "$OLDPWD/site/skill/brickmesh-skill.zip" brickmesh )
          cp .claude-plugin/marketplace.json site/marketplace.json

          touch site/.nojekyll
          ls -l site site/examples site/data

      # Prove the thing that is about to be published actually answers, rather
      # than merely compiling. Same check the Go tests run, against the same
      # module, with node from the runner.
      # Prove the thing about to be published answers, and that the worker the
      # page talks to carries the answer back. A page that loads and a module
      # that works do not add up to a working page if the message between them
      # is wrong.
      # The plugin carries a copy of the skill so it can be installed on its
      # own. A copy that has drifted from the one this repository uses is worse
      # than no copy: it would be the version people got.
      - name: The plugin's skill is the repository's skill
        run: |
          diff -u .claude/skills/brickmesh/SKILL.md \
                  plugin/brickmesh/skills/brickmesh/SKILL.md

      - name: The module and the worker answer before they are published
        env:
          BRICKMESH_LIBRARIES: '1'
        run: go test ./internal/calc/ -run "Browser|TheWorker"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    # Pages needs the repository to be public, or a plan that allows it for a
    # private one. Guarded rather than left to fail, so the build above still
    # checks every push while the repository is private.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish
      id-token: write   # to prove to Pages that this workflow published it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
