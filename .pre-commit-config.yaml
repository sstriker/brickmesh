repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Every source file carries an SPDX header naming the copyright holder; this
  # keeps that true for files added later. See NOTICE.
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: SPDX header on Python sources
        files: ^(extract|tests)/.*\.py$
        args:
          - --comment-style
          - "|#|"
          - --license-filepath
          - .license-header.txt
          - --fuzzy-match-generates-todo
      - id: insert-license
        name: SPDX header on Go sources
        files: ^(cmd|internal)/.*\.go$
        args:
          - --comment-style
          - "|//|"
          - --license-filepath
          - .license-header.txt
          - --fuzzy-match-generates-todo

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2

  # Audits the GitHub Actions workflows themselves: unpinned actions, injectable
  # expressions, over-broad permissions.
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.22.0
    hooks:
      - id: zizmor
        args: [--min-severity, low]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff
        name: Ruff linter
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
