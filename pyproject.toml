[project]
name = "brickmesh-checks"
version = "0.1.0"
description = "The checks on brickmesh's generated output that are easier to write in Python than in Go"
authors = [
    { name = "Sander Striker", email = "s.striker@striker.nl" },
]
requires-python = ">=3.12"
readme = "tests/README.md"
license = "Apache-2.0"

# What is left here is not an implementation. The engine was Python once and was
# ported to Go module by module; docs/findings.md records what each port was
# checked against. The Python went when the port finished, because a second
# implementation that has fallen behind is worse than none — it answers
# confidently and wrongly.
#
# What remains tests the Go. tests/test_animation_lua.py runs the LDCad
# animation script the engine writes, under a real Lua runtime, against a stub
# of LDCad's API — because nothing on the Go side can tell whether the text it
# emits is valid Lua, let alone whether the arithmetic comes out right.
dependencies = []

[dependency-groups]
test = [
    "pytest>=8.0",
    # The Lua runtime. Generated Lua that nothing executes is generated Lua
    # nobody has checked.
    "lupa>=2.0",
]
dev = [
    "prek>=0.2.0,<0.3",
    "ruff>=0.9.4",
]

[tool.uv]
default-groups = ["test", "dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",
    "W",
    "F",
    "RUF", # ruff-checks
    "UP",  # pyupgrade
]
